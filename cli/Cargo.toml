[package]
name = "cargo-aiv"
version = "0.1.0"
edition = "2021"
description = "Prove AI-generated Rust is panic-free — auto-generates a Kani proof harness and reports BUG / UNGUARDED / VERIFIED."
license = "MIT"
repository = "https://github.com/ss1738/cargo-aiv"
keywords = ["formal-verification", "kani", "ai", "testing", "panic"]
categories = ["development-tools", "development-tools::testing"]
readme = "../README.md"

[[bin]]
name = "cargo-aiv"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

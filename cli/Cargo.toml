[package]
name = "cargo-vouch"
version = "0.3.0"
edition = "2021"
description = "Prove a loop-light Rust function is panic-free — no annotations. Auto-generates a Kani proof harness for every function in a file and reports BUG / UNGUARDED / VERIFIED / INCONCLUSIVE with a concrete counterexample. A DX layer over Kani/CBMC."
license = "MIT"
repository = "https://github.com/ss1738/cargo-vouch"
keywords = ["formal-verification", "kani", "ai", "testing", "panic"]
categories = ["development-tools", "development-tools::testing"]
readme = "../README.md"

[[bin]]
name = "cargo-vouch"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

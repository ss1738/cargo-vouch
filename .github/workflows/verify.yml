name: verify

# Formal-verification gate. Kani install is heavy, so this runs on demand and on a
# weekly schedule rather than every push. Copy this into your own repo and point the
# batch run at the functions you want proven panic-free.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

jobs:
  vouch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Kani (the verification engine)
        run: |
          cargo install --locked kani-verifier
          cargo kani setup

      - name: Install cargo-vouch
        run: cargo install --path cli

      # Guard against false-green: fail loudly if Kani isn't wired up, rather than
      # silently "passing" every function.
      - name: Self-test the verifier
        run: cargo-vouch --selftest

      # End-to-end tests (need Kani, so #[ignore]d in the fast CI).
      - name: Integration tests
        run: cargo test --release --manifest-path cli/Cargo.toml -- --ignored

      # Fails the job (exit 1) if any function in verify/ has a reachable panic.
      # A directory arg recurses into every .rs under it.
      - name: Prove verify/ is panic-free
        run: cargo-vouch verify/

<!doctype html><html><head><meta charset="utf-8"><style>
  :root{--ground:#F4F5F3;--ink:#14181A;--muted:#5B6560;--accent:#17795A;--line:#E1E4DF;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;--sans:-apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--ground);color:var(--ink)}
  .card{position:relative;overflow:hidden;background:var(--ground);display:flex}
  .txt{display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:16px}
  .seal{border-radius:14px;background:var(--accent);color:#fff;font-family:var(--mono);font-weight:700;display:flex;align-items:center;justify-content:center}
  .wm{font-family:var(--mono);font-weight:700} .wm b{color:var(--accent)}
  .h{font-weight:800;letter-spacing:-.025em;line-height:1.0;text-wrap:balance}
  .sub{color:var(--muted);font-weight:500}
  .cmd{font-family:var(--mono);background:#0C120F;color:#EAF7F1;border-radius:12px;display:inline-block}
  .foot{font-family:var(--mono);color:var(--muted);display:flex;justify-content:space-between} .foot b{color:var(--accent)}
  .art{background:var(--ground);border-left:1px solid var(--line)}
  .art img{width:100%;height:100%;object-fit:cover;display:block}
</style></head><body>
<div class="card" style="width:1200px;height:627px">
  <div class="txt" style="width:680px;padding:54px 56px">
    <div class="brand"><span class="seal" style="width:46px;height:46px;font-size:27px">✓</span><span class="wm" style="font-size:31px">cargo-<b>vouch</b></span></div>
    <div class="h" style="font-size:50px;margin-top:22px">Find the input that breaks your code.</div>
    <div class="sub" style="font-size:22px;margin-top:18px;line-height:1.35">It proves a Rust function can't panic, or hands you the exact input that does. Zero annotations, built on Kani.</div>
    <span class="cmd" style="font-size:23px;padding:14px 22px;margin-top:auto">cargo install cargo-vouch</span>
    <div class="foot" style="font-size:18px;margin-top:18px"><span>github.com/ss1738/<b>cargo-vouch</b></span></div>
  </div>
  <div class="art" style="flex:1"><img src="images/magnify.png" alt=""></div>
</div></body></html>
